<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Playground — Classgrid</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<style>
  :root{
    --bg:#0f1115; --panel:#161a21; --panel-2:#1c222b; --border:#2a323d;
    --text:#e6edf3; --muted:#8b98a8; --accent:#4f8cff;
    --ok:#3fb950; --err:#f85149; --warn:#d29922;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  header{
    display:flex; align-items:center; gap:12px; padding:10px 16px;
    background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap;
  }
  .brand{font-weight:700; font-size:15px; letter-spacing:.2px; white-space:nowrap}
  .brand span{color:var(--accent)}
  .spacer{flex:1}
  button{
    font:inherit; font-size:13px; padding:7px 14px; border-radius:8px;
    border:1px solid var(--border); background:var(--panel-2); color:var(--text);
    cursor:pointer; transition:background .15s,border-color .15s;
  }
  button:hover{background:#232b36; border-color:#3a4553}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
  button.primary:hover{background:#3d7bf0}
  button:disabled{opacity:.5; cursor:not-allowed}
  select{
    font:inherit; font-size:13px; padding:7px 10px; border-radius:8px;
    border:1px solid var(--border); background:var(--panel-2); color:var(--text); cursor:pointer;
  }
  .status{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted)}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--warn); flex:none}
  .dot.ready{background:var(--ok)}
  .dot.loading{background:var(--warn); animation:pulse 1s infinite}
  .dot.err{background:var(--err)}
  @keyframes pulse{50%{opacity:.25}}
  main{flex:1; display:flex; min-height:0}
  .pane{display:flex; flex-direction:column; min-width:0; min-height:0}
  .pane.left{flex:1.15; border-right:1px solid var(--border)}
  .pane.right{flex:1}
  .pane-head{
    display:flex; align-items:center; gap:8px; padding:7px 12px;
    background:var(--panel); border-bottom:1px solid var(--border);
    font-size:11px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.7px; font-weight:600;
  }
  .editor-wrap{flex:1; min-height:0; overflow:hidden}
  .CodeMirror{
    height:100% !important;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13.5px; line-height:1.55;
  }
  #out{
    flex:1; overflow:auto; padding:12px 14px; background:#0c0e12;
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; line-height:1.6;
    white-space:pre-wrap; word-break:break-word;
  }
  #out .line{display:block}
  #out .err{color:var(--err)}
  #out .ok{color:var(--ok)}
  #out .muted{color:var(--muted)}
  .hint{
    font-size:11px; color:var(--muted); padding:6px 12px;
    border-top:1px solid var(--border); background:var(--panel);
  }
  @media (max-width:820px){
    main{flex-direction:column}
    .pane.left{border-right:none; border-bottom:1px solid var(--border)}
    .pane.left,.pane.right{flex:1}
  }
</style>
</head>
<body>

<header>
  <div class="brand">Classgrid <span>Python Playground</span></div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">Python not loaded yet</span></div>
  <div class="spacer"></div>
  <select id="examples">
    <option value="">Load an example…</option>
    <option value="hello">Hello, world</option>
    <option value="loops">Loops and lists</option>
    <option value="functions">Functions and defaults</option>
    <option value="class">Classes</option>
    <option value="dict">Dictionaries and sorting</option>
    <option value="recursion">Recursion</option>
  </select>
  <button id="clearBtn">Clear output</button>
  <button id="resetBtn">Reset code</button>
  <button class="primary" id="runBtn">▶ Run</button>
</header>

<main>
  <div class="pane left">
    <div class="pane-head">main.py <span class="spacer"></span><span id="lines">0 lines</span></div>
    <div class="editor-wrap"><textarea id="code"></textarea></div>
    <div class="hint">Ctrl + Enter to run · Tab inserts 4 spaces · your code is saved in this browser</div>
  </div>
  <div class="pane right">
    <div class="pane-head">Output <span class="spacer"></span><span id="timing"></span></div>
    <div id="out"><span class="line muted">Press Run to execute your Python code. The first run downloads the Python runtime (about 10 MB), so give it a few seconds.</span></div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
(function () {
  "use strict";

  var STORAGE_KEY = "cg_py_playground_code_v2";

  var DEFAULT_CODE = [
    "# Welcome to the Classgrid Python Playground",
    "# Type your code here, then press Run (or Ctrl + Enter).",
    "",
    "def greet(name):",
    "    return f\"Hello, {name}! Welcome to Python.\"",
    "",
    "for i in range(1, 6):",
    "    print(greet(f\"student {i}\"))",
    "",
    "numbers = [4, 8, 15, 16, 23, 42]",
    "print(\"Sum:\", sum(numbers))",
    "print(\"Even squares:\", [n * n for n in numbers if n % 2 == 0])",
    ""
  ].join("\n");

  var EXAMPLES = {
    hello: "print(\"Hello, world!\")\nprint(\"This runs inside your browser.\")\n",
    loops: [
      "fruits = [\"apple\", \"banana\", \"cherry\"]",
      "",
      "for i, fruit in enumerate(fruits, start=1):",
      "    print(i, fruit)",
      "",
      "total = 0",
      "for n in range(1, 11):",
      "    total += n",
      "print(\"Sum of 1 to 10 =\", total)",
      ""
    ].join("\n"),
    functions: [
      "def area(length, width=10):",
      "    \"\"\"Rectangle area, width defaults to 10.\"\"\"",
      "    return length * width",
      "",
      "print(area(5))",
      "print(area(5, 3))",
      "",
      "def stats(*nums):",
      "    return min(nums), max(nums), sum(nums) / len(nums)",
      "",
      "print(stats(4, 9, 2, 7))",
      ""
    ].join("\n"),
    class: [
      "class Student:",
      "    def __init__(self, name, marks):",
      "        self.name = name",
      "        self.marks = marks",
      "",
      "    def average(self):",
      "        return sum(self.marks) / len(self.marks)",
      "",
      "    def __str__(self):",
      "        return f\"{self.name}: {self.average():.1f}%\"",
      "",
      "s = Student(\"Riya\", [86, 78, 92])",
      "print(s)",
      ""
    ].join("\n"),
    dict: [
      "marks = {\"Maths\": 86, \"Science\": 78, \"English\": 92}",
      "",
      "for subject, score in marks.items():",
      "    print(f\"{subject:<10} {score}\")",
      "",
      "best = sorted(marks.items(), key=lambda kv: kv[1], reverse=True)",
      "print(\"Ranking:\", best)",
      ""
    ].join("\n"),
    recursion: [
      "def factorial(n):",
      "    if n <= 1:",
      "        return 1",
      "    return n * factorial(n - 1)",
      "",
      "def fib(n, memo={}):",
      "    if n in memo:",
      "        return memo[n]",
      "    if n < 2:",
      "        return n",
      "    memo[n] = fib(n - 1, memo) + fib(n - 2, memo)",
      "    return memo[n]",
      "",
      "print(\"5! =\", factorial(5))",
      "print(\"fib(20) =\", fib(20))",
      ""
    ].join("\n")
  };

  var outEl = document.getElementById("out");
  var dotEl = document.getElementById("dot");
  var statusEl = document.getElementById("statusText");
  var runBtn = document.getElementById("runBtn");
  var timingEl = document.getElementById("timing");
  var linesEl = document.getElementById("lines");

  var pyodide = null;
  var loadingPromise = null;
  var running = false;

  var editor = CodeMirror.fromTextArea(document.getElementById("code"), {
    mode: "python",
    theme: "material-darker",
    lineNumbers: true,
    indentUnit: 4,
    tabSize: 4,
    indentWithTabs: false,
    autoCloseBrackets: true,
    lineWrapping: true,
    extraKeys: {
      "Ctrl-Enter": function () { run(); },
      "Cmd-Enter": function () { run(); }
    }
  });

  var saved = null;
  try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) { saved = null; }
  editor.setValue(saved && saved.trim() ? saved : DEFAULT_CODE);

  var saveTimer = null;
  editor.on("change", function () {
    updateLineCount();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(STORAGE_KEY, editor.getValue()); } catch (e) {}
    }, 400);
  });

  function updateLineCount() {
    var n = editor.lineCount();
    linesEl.textContent = n + (n === 1 ? " line" : " lines");
  }
  updateLineCount();

  function setStatus(kind, text) {
    dotEl.className = "dot" + (kind ? " " + kind : "");
    statusEl.textContent = text;
  }

  function clearOut() {
    outEl.innerHTML = "";
    timingEl.textContent = "";
  }

  function write(text, cls) {
    var span = document.createElement("span");
    span.className = "line" + (cls ? " " + cls : "");
    span.textContent = text;
    outEl.appendChild(span);
    outEl.scrollTop = outEl.scrollHeight;
  }

  function ensurePyodide() {
    if (pyodide) return Promise.resolve(pyodide);
    if (loadingPromise) return loadingPromise;

    setStatus("loading", "Loading Python… (first time only)");
    loadingPromise = loadPyodide({
      indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/"
    }).then(function (py) {
      py.setStdout({ batched: function (s) { write(s, ""); } });
      py.setStderr({ batched: function (s) { write(s, "err"); } });
      try {
        py.setStdin({
          stdin: function () {
            var v = window.prompt("Program is asking for input:");
            return v === null ? "" : v;
          }
        });
      } catch (e) { /* older builds: input() unsupported */ }
      pyodide = py;
      setStatus("ready", "Python " + py.version.split(" ")[0] + " ready");
      return py;
    }).catch(function (err) {
      loadingPromise = null;
      setStatus("err", "Could not load Python");
      throw err;
    });

    return loadingPromise;
  }

  // Strip the runtime's own internal frames so only the user's code shows.
  function cleanTraceback(msg) {
    var lines = String(msg).split("\n");
    var kept = [];
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      if (l.indexOf("pyodide/_base.py") !== -1) continue;
      if (l.indexOf("await CodeRunner") !== -1) continue;
      if (l.indexOf("coroutine = eval(") !== -1) continue;
      if (/^\s*\^+\s*$/.test(l)) continue;
      kept.push(l);
    }
    return kept.join("\n").replace(/\n{3,}/g, "\n\n").trim();
  }

  function run() {
    if (running) return;
    var code = editor.getValue();
    if (!code.trim()) {
      clearOut();
      write("Nothing to run — the editor is empty.", "muted");
      return;
    }

    running = true;
    runBtn.disabled = true;
    runBtn.textContent = "Running…";
    clearOut();

    var started = performance.now();

    ensurePyodide().then(function (py) {
      return py.runPythonAsync(code);
    }).then(function () {
      var ms = Math.round(performance.now() - started);
      write("", "");
      write("✓ Finished in " + ms + " ms", "ok");
      timingEl.textContent = ms + " ms";
    }).catch(function (err) {
      var msg = (err && err.message) ? err.message : String(err);
      write(cleanTraceback(msg), "err");
      timingEl.textContent = "error";
    }).then(function () {
      running = false;
      runBtn.disabled = false;
      runBtn.textContent = "▶ Run";
    });
  }

  runBtn.addEventListener("click", run);

  document.getElementById("clearBtn").addEventListener("click", function () {
    clearOut();
    write("Output cleared.", "muted");
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    if (!window.confirm("Replace the editor with the starter code?")) return;
    editor.setValue(DEFAULT_CODE);
    clearOut();
    write("Editor reset to the starter code.", "muted");
  });

  document.getElementById("examples").addEventListener("change", function (e) {
    var key = e.target.value;
    if (!key || !EXAMPLES[key]) return;
    editor.setValue(EXAMPLES[key]);
    clearOut();
    write("Loaded example: " + e.target.options[e.target.selectedIndex].text, "muted");
    e.target.value = "";
    editor.focus();
  });

  // Warm up Python in the background so the first Run feels instant.
  window.addEventListener("load", function () {
    setTimeout(function () {
      ensurePyodide().catch(function () {});
    }, 800);
  });
})();
</script>
</body>
</html>
